<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party & Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        /* Custom scrollbar for chat */
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); }
        .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 3px; }
        .chat-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 min-h-screen text-white font-sans">

<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 w-full max-w-md border border-white/20">
        <h1 class="text-4xl font-bold text-white mb-2 text-center">Watch Party</h1>
        <p class="text-purple-200 text-center mb-8">Watch & Chat Together</p>

        <div id="login-error" class="hidden bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-4"></div>

        <div class="space-y-4">
            <div>
                <label class="block text-white text-sm font-medium mb-2">Email</label>
                <input type="email" id="email-input"
                       class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-lg text-white placeholder-white/50 focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/50"
                       placeholder="Enter your email">
            </div>
            <div>
                <label class="block text-white text-sm font-medium mb-2">Password</label>
                <input type="password" id="password-input"
                       class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-lg text-white placeholder-white/50 focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/50"
                       placeholder="Enter your password">
            </div>
            <button id="login-btn"
                    class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold py-3 px-6 rounded-lg hover:from-purple-600 hover:to-pink-600 transition duration-300 shadow-lg">
                Login
            </button>
        </div>
    </div>
</div>

<div id="party-screen" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 w-full max-w-md border border-white/20">
        <h2 class="text-3xl font-bold text-white mb-6 text-center">Welcome!</h2>

        <div id="party-error" class="hidden bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-4"></div>

        <div class="space-y-4">
            <button id="create-party-btn"
                    class="w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white font-semibold py-4 px-6 rounded-lg hover:from-green-600 hover:to-emerald-600 transition duration-300 shadow-lg flex items-center justify-center gap-2">
                <span class="text-2xl">+</span>
                Create A Watch Party
            </button>

            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-white/30"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-transparent text-white/70">or</span>
                </div>
            </div>

            <div>
                <input type="text" id="party-id-input"
                       class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-lg text-white placeholder-white/50 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/50 mb-3"
                       placeholder="Enter Party ID">
                <button id="join-party-btn"
                        class="w-full bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-semibold py-4 px-6 rounded-lg hover:from-blue-600 hover:to-cyan-600 transition duration-300 shadow-lg">
                    Join A Watch Party
                </button>
            </div>
        </div>
    </div>
</div>

<div id="create-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 w-full max-w-md border border-white/20">
        <h3 class="text-2xl font-bold text-white mb-4">Create Watch Party</h3>
        <input type="text" id="party-name-input"
               class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-lg text-white placeholder-white/50 focus:outline-none focus:border-purple-400 mb-4"
               placeholder="Enter party name">
        <div class="flex gap-3">
            <button id="create-confirm-btn"
                    class="flex-1 bg-green-500 text-white font-semibold py-3 rounded-lg hover:bg-green-600 transition">
                Create
            </button>
            <button id="create-cancel-btn"
                    class="flex-1 bg-gray-500 text-white font-semibold py-3 rounded-lg hover:bg-gray-600 transition">
                Cancel
            </button>
        </div>
    </div>
</div>

<div id="video-screen" class="hidden min-h-screen p-4">
    <div class="max-w-[1600px] mx-auto h-[calc(100vh-2rem)] flex flex-col gap-4">
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-4 border border-white/20 flex justify-between items-center shrink-0">
            <div>
                <h2 class="text-2xl font-bold text-white" id="party-name-display">Watch Party</h2>
                <p class="text-purple-200 text-sm">Party ID: <span id="party-id-display" class="font-mono select-all">-</span></p>
            </div>
            <button id="leave-party-btn"
                    class="bg-red-500 text-white font-semibold py-2 px-6 rounded-lg hover:bg-red-600 transition">
                Leave Party
            </button>
        </div>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-4 min-h-0">

            <div class="lg:col-span-3 flex flex-col gap-4 h-full overflow-y-auto">
                <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-4 border border-white/20 flex-1 flex flex-col justify-center">
                    <video id="video-player" class="w-full max-h-full rounded-lg bg-black shadow-lg" controls>
                        Your browser does not support the video tag.
                    </video>
                </div>

                <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-6 border border-white/20 shrink-0">
                    <div class="flex gap-3">
                        <input type="text" id="video-url-input"
                               class="flex-1 px-4 py-3 bg-white/10 border border-white/30 rounded-lg text-white placeholder-white/50 focus:outline-none focus:border-purple-400"
                               placeholder="Enter video URL (e.g., https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4)">
                        <button id="load-video-btn"
                                class="bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold py-3 px-6 rounded-lg hover:from-purple-600 hover:to-pink-600 transition whitespace-nowrap">
                            Load Video
                        </button>
                    </div>
                </div>

                <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-4 border border-white/20 shrink-0">
                    <h3 class="text-lg font-bold text-white mb-2">Party Members</h3>
                    <div id="members-list" class="flex flex-wrap gap-2">
                        <p class="text-purple-200">Loading members...</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1 flex flex-col h-full bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
                <div class="p-4 border-b border-white/10 bg-white/5">
                    <h3 class="font-bold text-lg flex items-center gap-2">
                        <span>💬</span> Live Chat
                    </h3>
                </div>

                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 chat-scroll flex flex-col">
                    <div class="text-center text-white/30 text-sm mt-4">Welcome to the chat!</div>
                </div>

                <div class="p-3 border-t border-white/10 bg-white/5">
                    <form id="chat-form" class="flex gap-2">
                        <input type="text" id="chat-input"
                               class="flex-1 bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-sm text-white placeholder-white/40 focus:outline-none focus:ring-1 focus:ring-purple-400"
                               placeholder="Type a message..." autocomplete="off">
                        <button type="submit"
                                class="bg-purple-500 hover:bg-purple-600 text-white rounded-lg px-3 py-2 transition">
                            ➤
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>


<script>
    // Global state
    let authToken = null;
    let currentUser = null;
    let currentParty = null;
    let stompClient = null;

    // Config
    const API_BASE = 'http://localhost:8081/api/v1';
    const WS_ENDPOINT = 'http://localhost:8081/ws';
    const TOPIC_CHAT_PREFIX = '/topic/chat.';  // Assumption based on @SendTo in controller

    // --- START: Applied Sync Logic Variables ---
    let eventOwnerId;
    let isJoining = false;
    // --- END: Applied Sync Logic Variables ---

    // DOM elements
    const loginScreen = document.getElementById('login-screen');
    const partyScreen = document.getElementById('party-screen');
    const videoScreen = document.getElementById('video-screen');
    const loginError = document.getElementById('login-error');
    const partyError = document.getElementById('party-error');
    const createModal = document.getElementById('create-modal');
    const videoPlayer = document.getElementById('video-player');

    // Chat DOM elements
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    // Login functionality
    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('email-input').value;
        const password = document.getElementById('password-input').value;

        if (!email || !password) {
            showError(loginError, 'Please enter both email and password');
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Login failed');
            }

            const data = await response.json();
            authToken = data.data.token;
            currentUser = data.data;

            eventOwnerId = currentUser.id; // Initial sync logic

            loginScreen.classList.add('hidden');
            partyScreen.classList.remove('hidden');
        } catch (error) {
            showError(loginError, error.message || 'Login failed. Please check your credentials.');
        }
    });

    // Create party
    document.getElementById('create-party-btn').addEventListener('click', () => {
        createModal.classList.remove('hidden');
    });

    document.getElementById('create-cancel-btn').addEventListener('click', () => {
        createModal.classList.add('hidden');
        document.getElementById('party-name-input').value = '';
    });

    document.getElementById('create-confirm-btn').addEventListener('click', async () => {
        const partyName = document.getElementById('party-name-input').value;

        if (!partyName) {
            alert('Please enter a party name');
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/parties`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ partyName })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Failed to create party');
            }

            const data = await response.json();
            await getAndUpdatePartyDetails(data.data.id);
            createModal.classList.add('hidden');
            await initializeVideoScreen();
        } catch (error) {
            showError(partyError, error.message || 'Failed to create party');
        }
    });

    // Join party
    document.getElementById('join-party-btn').addEventListener('click', async () => {
        const partyId = document.getElementById('party-id-input').value;

        if (!partyId) {
            showError(partyError, 'Please enter a party ID');
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/parties/join`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ partyId })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Failed to join party');
            }

            const data = await response.json();
            currentParty = data.data;

            await initializeVideoScreen();
        } catch (error) {
            showError(partyError, error.message || 'Failed to join party. Check the party ID.');
        }
    });

    // Helper to get fresh party details
    async function getAndUpdatePartyDetails(partyId) {
        const response = await fetch(`${API_BASE}/parties/${partyId}`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!response.ok) throw new Error('Failed to fetch party details');

        const data = await response.json();
        currentParty = data.data; // Update global party state
    }

    // Initialize video screen
    async function initializeVideoScreen() {
        partyScreen.classList.add('hidden');
        videoScreen.classList.remove('hidden');

        document.getElementById('party-name-display').textContent = currentParty.partyName || 'Watch Party';
        document.getElementById('party-id-display').textContent = currentParty.id;

        // Clear previous chat messages
        chatMessages.innerHTML = '<div class="text-center text-white/30 text-sm mt-4">Welcome to the chat!</div>';

        // Connect WebSocket
        await connectWebSocket();

        // --- START: Applied Sync Logic ---
        if (currentParty.latestSyncEventPayload) {
            try {
                const syncEvent = JSON.parse(currentParty.latestSyncEventPayload);
                if (syncEvent.videoUrl) {
                    handleFirstEvent(syncEvent);
                }
            } catch (e) {
                console.error('Error parsing latestSyncEventPayload:', e);
            }
        }
        // --- END: Applied Sync Logic ---

        updateMembersList();
    }

    // WebSocket connection
    async function connectWebSocket() {
        const socket = new SockJS(`${WS_ENDPOINT}?token=${authToken}&partyId=${currentParty.id}`);
        stompClient = Stomp.over(socket);

        stompClient.debug = () => {}; // Disable debug logs

        return new Promise((resolve, reject) => {
            stompClient.connect(
                { Authorization: `Bearer ${authToken}` },
                (frame) => {
                    console.log('WebSocket connected');

                    // 1. Subscribe to VIDEO SYNC
                    stompClient.subscribe(`/topic/party.${currentParty.id}`, (message) => {
                        const event = JSON.parse(message.body);
                        if (event.event !== 'JOIN' && event.event !== 'LEFT') {
                            eventOwnerId = event.userId;
                        }
                        handleVideoEvent(event);
                    });

                    // 2. Subscribe to MEMBER events
                    stompClient.subscribe('/topic/member-events', (message) => {
                        if (currentParty) updateMembersList();
                    });

                    // 3. Subscribe to CHAT
                    // Your controller sends to TOPIC_PARTY_CHAT + "." + id
                    // Assuming TOPIC_PARTY_CHAT is "/topic/chat"
                    stompClient.subscribe(`${TOPIC_CHAT_PREFIX}${currentParty.id}`, (message) => {
                        const chatMsg = JSON.parse(message.body);
                        displayChatMessage(chatMsg);
                    });

                    // --- START: Applied Sync Logic ---
                    videoPlayer.addEventListener('play', sendVideoEvent);
                    videoPlayer.addEventListener('pause', sendVideoEvent);
                    videoPlayer.addEventListener('seeked', sendVideoEvent);
                    // --- END: Applied Sync Logic ---

                    resolve();
                },
                (error) => {
                    console.error('WebSocket error:', error);
                    reject(error);
                }
            );
        });
    }

    // --- CHAT LOGIC ---

    chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const messageContent = chatInput.value.trim();

        if (messageContent && stompClient) {
            // Prepare the payload based on ChatMessageInputDTO
            const payload = {
                content: messageContent
            };

            // Send to the destination mapped in your controller: @MessageMapping("/watchParty-chats/{id}")
            // Standard Prefix is usually /app
            stompClient.send(`/app/watchParty-chats/${currentParty.id}`, {}, JSON.stringify(payload));

            chatInput.value = ''; // Clear input
        }
    });

    function displayChatMessage(msg) {
        const isMe = msg.senderId === currentUser.id; // Assuming DTO has senderId, or adjust logic
        console.log(msg)
        // If DTO doesn't have senderId directly, we might need to check username
        // Based on typical DTO: senderName, content, timestamp
        const isMeByName = msg.senderName === currentUser.name; // Fallback check

        const alignClass = (isMe || isMeByName) ? 'self-end items-end' : 'self-start items-start';
        const bgClass = (isMe || isMeByName) ? 'bg-purple-600 text-white' : 'bg-white/10 text-white';
        const nameDisplay = (isMe || isMeByName) ? 'You' : msg.senderName;

        const msgElement = document.createElement('div');
        msgElement.className = `flex flex-col max-w-[85%] ${alignClass}`;
        msgElement.innerHTML = `
            <span class="text-[10px] text-white/50 mb-0.5 px-1">${nameDisplay}</span>
            <div class="${bgClass} px-3 py-2 rounded-xl shadow-sm text-sm break-words">
                ${escapeHtml(msg.content)}
            </div>
        `;

        chatMessages.appendChild(msgElement);
        chatMessages.scrollTop = chatMessages.scrollHeight; // Auto scroll to bottom
    }

    function escapeHtml(text) {
        if (!text) return "";
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // --- VIDEO LOGIC ---

    document.getElementById('load-video-btn').addEventListener('click', () => {
        const videoUrl = document.getElementById('video-url-input').value;
        if (!videoUrl) {
            alert('Please enter a video URL');
            return;
        }
        sendVideoUrl(currentParty.id, videoUrl);
        videoPlayer.src = videoUrl;
        videoPlayer.load();
    });

    function handleFirstEvent(syncNewUserMessage) {
        let videoCurrentTime = syncNewUserMessage.videoCurrentTime;
        let eventDateTime = syncNewUserMessage.eventDateTime;
        let videoUrl = syncNewUserMessage.videoUrl;

        const myTime = new Date().valueOf();
        const offset = (myTime - eventDateTime) / 1000;

        isJoining = true;

        switch (syncNewUserMessage.event) {
            case 'PLAY':
                videoPlayer.src = videoUrl;
                videoPlayer.load();
                videoPlayer.currentTime = videoCurrentTime + offset;
                videoPlayer.play();
                break;
            case 'PAUSE':
                videoPlayer.src = videoUrl;
                videoPlayer.load();
                videoPlayer.currentTime = videoCurrentTime;
                videoPlayer.pause();
                break;
            case 'SEEK':
                videoPlayer.src = videoUrl;
                videoPlayer.load();
                videoPlayer.currentTime = videoCurrentTime;
                if (syncNewUserMessage.previousEvent === 'PLAY') {
                    videoPlayer.currentTime = videoCurrentTime + offset;
                    videoPlayer.play();
                }
                break;
            case 'CHANGE_URL':
                videoPlayer.src = videoUrl;
                videoPlayer.load();
                break;
        }

        setTimeout(() => { isJoining = false; }, 500);
    }

    function handleVideoEvent(syncMessage) {
        if (syncMessage.userId === currentUser.id) return;

        if (syncMessage.event === 'LEFT' || syncMessage.event === 'JOIN') return;

        switch (syncMessage.event) {
            case 'PLAY':
                videoPlayer.currentTime = syncMessage.videoCurrentTime;
                videoPlayer.play();
                break;
            case 'PAUSE':
                videoPlayer.currentTime = syncMessage.videoCurrentTime;
                videoPlayer.pause();
                break;
            case 'SEEK':
                videoPlayer.currentTime = syncMessage.videoCurrentTime;
                break;
            case 'CHANGE_URL':
                videoPlayer.src = syncMessage.videoUrl;
                videoPlayer.load();
                videoPlayer.play();
                break;
        }
    }

    function sendVideoEvent(event) {
        if (eventOwnerId !== currentUser.id) {
            eventOwnerId = currentUser.id;
            return;
        }
        if (isJoining) return;

        const eventType = event.type.toUpperCase();

        const syncMessage = {
            event: eventType,
            videoCurrentTime: videoPlayer.currentTime,
            videoUrl: videoPlayer.src,
            userId: currentUser.id,
            eventDateTime: new Date().valueOf()
        };

        stompClient.send(`/app/party/${currentParty.id}`, {}, JSON.stringify(syncMessage));
    }

    function sendVideoUrl(partyId, videoUrl) {
        const syncMessage = {
            event: 'CHANGE_URL',
            videoUrl: videoUrl,
            videoCurrentTime: 0,
            userId: currentUser.id,
            userName: currentUser.name || currentUser.email,
            eventDateTime: new Date().valueOf()
        };
        stompClient.send(`/app/party/${partyId}`, {}, JSON.stringify(syncMessage));
    }

    // Update members list
    async function updateMembersList() {
        try {
            await getAndUpdatePartyDetails(currentParty.id);
            const members = currentParty.members || [];
            const membersList = document.getElementById('members-list');
            membersList.innerHTML = members.map(member => `
                    <div class="bg-white/5 rounded-lg px-3 py-1 text-white flex items-center gap-2 border border-white/10">
                        <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                        <span class="font-medium text-sm">${member.name}</span>
                        ${member.userId === currentParty.ownerUserId ? '<span class="text-yellow-400 text-xs" title="Host">👑</span>' : ''}
                    </div>
                `).join('');
        } catch (error) {
            console.error('Failed to update members:', error);
        }
    }

    // Leave party
    document.getElementById('leave-party-btn').addEventListener('click', async () => {
        try {
            videoPlayer.removeEventListener('play', sendVideoEvent);
            videoPlayer.removeEventListener('pause', sendVideoEvent);
            videoPlayer.removeEventListener('seeked', sendVideoEvent);

            await fetch(`${API_BASE}/parties/leave`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${authToken}` }
            });

            if (stompClient && stompClient.connected) {
                stompClient.disconnect(() => console.log('WebSocket disconnected'));
            }
            stompClient = null;

            videoScreen.classList.add('hidden');
            partyScreen.classList.remove('hidden');
            currentParty = null;
            videoPlayer.src = '';
        } catch (error) {
            console.error('Failed to leave party:', error);
        }
    });

    // Key Handlers
    document.getElementById('password-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
    document.getElementById('party-id-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('join-party-btn').click();
    });
    document.getElementById('party-name-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('create-confirm-btn').click();
    });
</script>
</body>
</html>
