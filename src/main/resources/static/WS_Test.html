<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party & Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        /* Custom scrollbar for chat */
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); }
        .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 3px; }
        .chat-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 min-h-screen text-white font-sans">

<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 w-full max-w-md border border-white/20">
        <h1 class="text-4xl font-bold text-white mb-2 text-center">Watch Party</h1>
        <p class="text-purple-200 text-center mb-8">Watch & Chat Together</p>

        <div id="login-error" class="hidden bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-4"></div>

        <div class="space-y-4">
            <div>
                <label class="block text-white text-sm font-medium mb-2">Email</label>
                <input type="email" id="email-input"
                       class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-lg text-white placeholder-white/50 focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/50"
                       placeholder="Enter your email">
            </div>
            <div>
                <label class="block text-white text-sm font-medium mb-2">Password</label>
                <input type="password" id="password-input"
                       class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-lg text-white placeholder-white/50 focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/50"
                       placeholder="Enter your password">
            </div>
            <button id="login-btn"
                    class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold py-3 px-6 rounded-lg hover:from-purple-600 hover:to-pink-600 transition duration-300 shadow-lg">
                Login
            </button>
        </div>
    </div>
</div>

<div id="party-screen" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 w-full max-w-md border border-white/20">
        <h2 class="text-3xl font-bold text-white mb-6 text-center">Welcome!</h2>

        <div id="party-error" class="hidden bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-4"></div>

        <div class="space-y-4">
            <button id="create-party-btn"
                    class="w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white font-semibold py-4 px-6 rounded-lg hover:from-green-600 hover:to-emerald-600 transition duration-300 shadow-lg flex items-center justify-center gap-2">
                <span class="text-2xl">+</span>
                Create A Watch Party
            </button>

            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-white/30"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-transparent text-white/70">or</span>
                </div>
            </div>

            <div>
                <input type="text" id="party-id-input"
                       class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-lg text-white placeholder-white/50 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/50 mb-3"
                       placeholder="Enter Party ID">
                <button id="join-party-btn"
                        class="w-full bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-semibold py-4 px-6 rounded-lg hover:from-blue-600 hover:to-cyan-600 transition duration-300 shadow-lg">
                    Join A Watch Party
                </button>
            </div>
        </div>
    </div>
</div>

<div id="create-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 w-full max-w-md border border-white/20">
        <h3 class="text-2xl font-bold text-white mb-4">Create Watch Party</h3>

        <div class="mb-4">
            <label class="block text-sm text-purple-200 mb-1">Party Name</label>
            <input type="text" id="party-name-input"
                   class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-lg text-white placeholder-white/50 focus:outline-none focus:border-purple-400"
                   placeholder="Enter party name">
        </div>

        <div class="mb-6">
            <label class="block text-sm text-purple-200 mb-1">Party Thumbnail (Optional)</label>
            <input type="file" id="party-thumbnail-input" accept="image/*"
                   class="w-full text-sm text-white/70 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-500 file:text-white hover:file:bg-purple-600 cursor-pointer">
        </div>

        <div class="flex gap-3">
            <button id="create-confirm-btn"
                    class="flex-1 bg-green-500 text-white font-semibold py-3 rounded-lg hover:bg-green-600 transition">
                Create
            </button>
            <button id="create-cancel-btn"
                    class="flex-1 bg-gray-500 text-white font-semibold py-3 rounded-lg hover:bg-gray-600 transition">
                Cancel
            </button>
        </div>
    </div>
</div>

<div id="video-screen" class="hidden min-h-screen p-4">
    <div class="max-w-[1600px] mx-auto h-[calc(100vh-2rem)] flex flex-col gap-4">
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-4 border border-white/20 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-4">
                <div id="party-thumbnail-display" class="w-12 h-12 rounded-lg bg-purple-700 overflow-hidden hidden border border-white/20">
                    <img src="" alt="Party" class="w-full h-full object-cover">
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-white" id="party-name-display">Watch Party</h2>
                    <p class="text-purple-200 text-sm">Party ID: <span id="party-id-display" class="font-mono select-all">-</span></p>
                </div>
            </div>
            <button id="leave-party-btn"
                    class="bg-red-500 text-white font-semibold py-2 px-6 rounded-lg hover:bg-red-600 transition">
                Leave Party
            </button>
        </div>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-4 min-h-0">

            <div class="lg:col-span-3 flex flex-col gap-4 h-full overflow-y-auto">
                <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-4 border border-white/20 flex-1 flex flex-col justify-center">
                    <video id="video-player" class="w-full max-h-full rounded-lg bg-black shadow-lg" controls>
                        Your browser does not support the video tag.
                    </video>
                </div>

                <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-6 border border-white/20 shrink-0">
                    <div class="flex gap-3">
                        <input type="text" id="video-url-input"
                               class="flex-1 px-4 py-3 bg-white/10 border border-white/30 rounded-lg text-white placeholder-white/50 focus:outline-none focus:border-purple-400"
                               placeholder="Enter video URL (e.g., https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4)">
                        <button id="load-video-btn"
                                class="bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold py-3 px-6 rounded-lg hover:from-purple-600 hover:to-pink-600 transition whitespace-nowrap">
                            Load Video
                        </button>
                    </div>
                </div>

                <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-4 border border-white/20 shrink-0">
                    <h3 class="text-lg font-bold text-white mb-2">Party Members</h3>
                    <div id="members-list" class="flex flex-wrap gap-2">
                        <p class="text-purple-200">Loading members...</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1 flex flex-col h-full bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
                <div class="p-4 border-b border-white/10 bg-white/5">
                    <h3 class="font-bold text-lg flex items-center gap-2">
                        <span>💬</span> Live Chat
                    </h3>
                </div>

                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 chat-scroll flex flex-col">
                    <div class="text-center text-white/30 text-sm mt-4">Welcome to the chat!</div>
                </div>

                <div class="p-3 border-t border-white/10 bg-white/5">
                    <form id="chat-form" class="flex gap-2">
                        <input type="text" id="chat-input"
                               class="flex-1 bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-sm text-white placeholder-white/40 focus:outline-none focus:ring-1 focus:ring-purple-400"
                               placeholder="Type a message..." autocomplete="off">
                        <button type="submit"
                                class="bg-purple-500 hover:bg-purple-600 text-white rounded-lg px-3 py-2 transition">
                            ➤
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
<script>
    // Global state
    let authToken = null;
    let currentUser = null;
    let currentParty = null;
    let stompClient = null;
    let suppressVideoEvents = false;

    // Config - Matches your Backend Constants
    // const API_BASE = 'http://localhost:8081/api/v1';
    // const WS_ENDPOINT = 'http://localhost:8081/ws';
    const API_BASE = 'http://localhost/api/v1';
    const WS_ENDPOINT = 'http://localhost/ws';
    const TOPIC_CHAT_PREFIX = '/topic/chat.'; // TOPIC_PARTY_CHAT
    const TOPIC_VIDEO_PREFIX = '/topic/party.';
    const TOPIC_MEMBER_EVENTS = '/topic/member-events';

    // DOM elements
    const loginScreen = document.getElementById('login-screen');
    const partyScreen = document.getElementById('party-screen');
    const videoScreen = document.getElementById('video-screen');
    const loginError = document.getElementById('login-error');
    const partyError = document.getElementById('party-error');
    const createModal = document.getElementById('create-modal');
    const videoPlayer = document.getElementById('video-player');
    const membersList = document.getElementById('members-list');
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    // --- Helper Functions ---
    function buildAuthHeader() {
        return { 'Authorization': `Bearer ${authToken}` };
    }

    function showError(element, message) {
        element.textContent = message;
        element.classList.remove('hidden');
        setTimeout(() => element.classList.add('hidden'), 5000);
    }

    // --- Login Logic ---
    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('email-input').value;
        const password = document.getElementById('password-input').value;

        try {
            const response = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Login failed');

            // Based on your ApiResponse structure (data.data.token)
            authToken = result.data.token;
            currentUser = result.data;

            loginScreen.classList.add('hidden');

            // Check if user is already in a party (based on your Controller logic)
            if (currentUser.partyId) {
                await getAndUpdatePartyDetails(currentUser.partyId);
                await initializeVideoScreen();
            } else {
                partyScreen.classList.remove('hidden');
            }
        } catch (error) {
            showError(loginError, error.message);
        }
    });

    // --- Party Actions ---
    document.getElementById('create-party-btn').addEventListener('click', () => createModal.classList.remove('hidden'));
    document.getElementById('create-cancel-btn').addEventListener('click', () => createModal.classList.add('hidden'));

    document.getElementById('create-confirm-btn').addEventListener('click', async () => {
        const partyName = document.getElementById('party-name-input').value;
        const thumbnailFile = document.getElementById('party-thumbnail-input').files[0];

        const formData = new FormData();
        formData.append('partyName', partyName);
        if (thumbnailFile) formData.append('thumbnailMultipartFile', thumbnailFile);

        try {
            const response = await fetch(`${API_BASE}/parties`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${authToken}` },
                body: formData
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message);

            await getAndUpdatePartyDetails(result.data.id);
            createModal.classList.add('hidden');
            await initializeVideoScreen();
        } catch (error) {
            showError(partyError, error.message);
        }
    });

    document.getElementById('join-party-btn').addEventListener('click', async () => {
        const partyId = document.getElementById('party-id-input').value;
        try {
            const response = await fetch(`${API_BASE}/parties/join`, {
                method: 'PATCH',
                headers: { ...buildAuthHeader(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ partyId })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message);

            currentParty = result.data;
            await initializeVideoScreen();
        } catch (error) {
            showError(partyError, error.message);
        }
    });

    async function getAndUpdatePartyDetails(partyId) {
        const response = await fetch(`${API_BASE}/parties/${partyId}`, { headers: buildAuthHeader() });
        const result = await response.json();
        currentParty = result.data;
    }

    async function initializeVideoScreen() {
        partyScreen.classList.add('hidden');
        videoScreen.classList.remove('hidden');

        document.getElementById('party-name-display').textContent = currentParty.partyName;
        document.getElementById('party-id-display').textContent = currentParty.id;

        if (currentParty.currentVideoUrl) {
            videoPlayer.src = currentParty.currentVideoUrl;
        }

        chatMessages.innerHTML = '';
        await loadChatHistory();
        renderMembers(currentParty.members || []);
        connectWebSocket();
    }

    // --- WebSocket Logic ---
    function connectWebSocket() {
        const socket = new SockJS(`${WS_ENDPOINT}?token=${authToken}`);
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // Set to console.log for debugging frames

        stompClient.connect(buildAuthHeader(), (frame) => {
            // 1. Video Sync Sub
            stompClient.subscribe(`${TOPIC_VIDEO_PREFIX}${currentParty.id}`, (msg) => {
                handleRemoteSyncEvent(JSON.parse(msg.body));
            });

            // 2. Chat Sub
            stompClient.subscribe(`${TOPIC_CHAT_PREFIX}${currentParty.id}`, (msg) => {
                appendChatMessage(JSON.parse(msg.body));
            });

            // 3. Member Events Sub
            stompClient.subscribe(TOPIC_MEMBER_EVENTS, (msg) => {
                const event = JSON.parse(msg.body);
                // Refresh list if someone else joined/left
                if (event.userId !== currentUser.id) refreshMembersList();
            });
            stompClient.subscribe('/user/queue/errors', (message) => {
                const errorMessage = message.body;
                console.error("Received error from server:", errorMessage);

                // Handle the error in your UI (e.g., show a toast notification)
                alert("Server Error: " + errorMessage);
            });
        }, (err) => setTimeout(connectWebSocket, 3000));
    }

    // --- Video Sync Handling ---
    function sendSyncEvent(eventType, overrideUrl = null) {
        if (suppressVideoEvents || !stompClient?.connected) return;

        const payload = {
            event: eventType,
            videoUrl: overrideUrl || videoPlayer.src,
            videoCurrentTime: videoPlayer.currentTime
        };
        stompClient.send(`/app/party/${currentParty.id}`, {}, JSON.stringify(payload));
    }

    videoPlayer.onplay = () => sendSyncEvent('PLAY');
    videoPlayer.onpause = () => sendSyncEvent('PAUSE');
    videoPlayer.onseeked = () => sendSyncEvent('SEEK');

    document.getElementById('load-video-btn').onclick = () => {
        const url = document.getElementById('video-url-input').value;
        if (url) sendSyncEvent('CHANGE_URL', url);
    };

    function handleRemoteSyncEvent(data) {
        if (data.userId === currentUser.id && data.event !== 'CHANGE_URL') return;

        suppressVideoEvents = true;
        if (data.event === 'CHANGE_URL') {
            videoPlayer.src = data.videoUrl;
        } else if (data.event === 'PLAY') {
            videoPlayer.currentTime = data.videoCurrentTime;
            videoPlayer.play();
        } else if (data.event === 'PAUSE') {
            videoPlayer.pause();
        } else if (data.event === 'SEEK') {
            videoPlayer.currentTime = data.videoCurrentTime;
        }
        setTimeout(() => suppressVideoEvents = false, 500);
    }

    // --- Chat Handling ---
    async function loadChatHistory() {
        try {
            const res = await fetch(`${API_BASE}/parties/${currentParty.id}/messages?page=0&size=50`, { headers: buildAuthHeader() });
            const result = await res.json();
            // Data is paginated, reverse to show oldest first at top
            result.data.content.reverse().forEach(msg => appendChatMessage(msg));
        } catch (e) { console.error("Chat History Load Failed", e); }
    }

    chatForm.onsubmit = (e) => {
        e.preventDefault();
        const content = chatInput.value.trim();
        if (!content || !stompClient?.connected) return;

        // Matches PartyMessageInputDTO
        stompClient.send(`/app/watchParty-chats/${currentParty.id}`, {}, JSON.stringify({ content }));
        chatInput.value = '';
    };

    function appendChatMessage(msg) {
        const isMe = (msg.userId === currentUser.id);
        const div = document.createElement('div');
        div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
        div.innerHTML = `
            <div class="max-w-[85%] px-3 py-2 rounded-lg text-sm break-words ${isMe ? 'bg-purple-600 text-white rounded-tr-none' : 'bg-white/20 text-white rounded-tl-none'}">
                ${msg.content}
            </div>
            <div class="text-[10px] text-white/40 mt-1 px-1">${msg.senderName || 'User'}</div>
        `;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // --- Member Management ---
    function renderMembers(members) {
        membersList.innerHTML = members.map(m => `
            <div class="flex items-center gap-2 bg-white/10 px-3 py-1 rounded-full text-sm border border-white/10">
                <span class="w-5 h-5 bg-purple-500 rounded-full flex items-center justify-center text-xs font-bold">
                    ${m.name.charAt(0).toUpperCase()}
                </span> ${m.name}
            </div>
        `).join('') || '<span class="text-white/50 text-sm">Waiting for friends...</span>';
    }

    async function refreshMembersList() {
        const res = await fetch(`${API_BASE}/parties/${currentParty.id}`, { headers: buildAuthHeader() });
        const result = await res.json();
        renderMembers(result.data.members || []);
    }

    document.getElementById('leave-party-btn').onclick = async () => {
        if (!confirm("Leave this party?")) return;
        await fetch(`${API_BASE}/parties/leave`, { method: 'DELETE', headers: buildAuthHeader() });
        location.reload();
    };
</script>
</body>
</html>
